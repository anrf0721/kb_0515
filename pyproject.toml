[project]
name = "kb-0515"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "minio>=7.2.20",
    "numpy>=2.5.1",
    "onnxruntime>=1.19.2,<1.20.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "flagembedding>=1.3.5",
    "transformers==4.48.0",
    "sentencepiece==0.2.0",
    "modelscope>=1.39.1",
    "pymilvus[model]>=3.0.1",
    "protobuf>=5.27.2,<6.0.0",
    "utils>=1.0.2",
    "openai-agents>=0.20.0",
    "mcp>=1.12,<2.0",
    "dashscope>=1.26.7",
]


[tool.uv.sources]
# 强制从 NVIDIA CUDA‑12.1 源安装torch全家桶
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
